name: Magazine validation
on:
  pull_request:
    paths:
      - 'magazine.html'
      - 'assets/magazine.*'
      - 'data/articles/**'
      - 'tests/test_magazine.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check assets/magazine.js
      - name: Validate article schema and assets
        run: python3 -m unittest discover -s tests -p 'test_magazine.py' -v
